name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse3-dev
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format . --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse3-dev
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - run: uv sync --dev
      - run: uv run pyright vaultfs/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vault404_test
          POSTGRES_USER: vault404
          POSTGRES_PASSWORD: vault404
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready -U vault404 -d vault404_test
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse3-dev
      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - run: uv sync --dev
      - run: uv run pytest
