[global]
   workgroup = VAULTFS
   server string = VaultFS Virtual Storage
   security = user
   map to guest = never
   restrict anonymous = 2
   guest account = nobody
   log level = 5 auth:10
   log file = /var/log/samba/log.%m
   max log size = 50
   interfaces = eth0
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[vault]
   comment = VaultFS Virtual Storage
   path = /mnt/vault
   browseable = yes
   read only = no
   guest ok = no
   valid users = @vaultfs
   create mask = 0644
   directory mask = 0755
   force user = vaultfs
   force group = vaultfs
