services:
  postgres:
    image: postgres:16-alpine
    container_name: vault404-postgres
    environment:
      POSTGRES_DB: vault404
      POSTGRES_USER: vault404
      POSTGRES_PASSWORD: vault404
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault404 -d vault404"]
      interval: 5s
      timeout: 5s
      retries: 5

  samba:
    image: dperson/samba:latest
    container_name: vault404-samba
    environment:
      WORKGROUP: VAULTFS
      USER: vaultfs;vaultfs
    ports:
      - "445:445"
    volumes:
      - /mnt/vault:/mnt/vault
      - ./conf/smb.conf:/etc/samba/smb.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
